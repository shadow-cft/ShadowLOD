
name: Build ShadowLOD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle Wrapper
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build --no-daemon
          else
            echo "Gradle wrapper belum tersedia."
            exit 1
          fi

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ShadowLOD
          path: build/libs/*.jar
